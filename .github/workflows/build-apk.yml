name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk adesh-ayat.apk

      - uses: actions/upload-artifact@v5
        with:
          name: adesh-ayat-apk
          path: adesh-ayat.apk

      # প্রতিটি বিল্ডের APK একটি Release-এ রাখা হয়, যাতে সরাসরি ডাউনলোড লিংক পাওয়া যায়
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest adesh-ayat.apk \
            --title "আদেশ-নিষেধের আয়াত (সর্বশেষ বিল্ড)" \
            --notes "Commit ${GITHUB_SHA::7} থেকে তৈরি। adesh-ayat.apk ডাউনলোড করে ফোনে ইনস্টল করুন।"
